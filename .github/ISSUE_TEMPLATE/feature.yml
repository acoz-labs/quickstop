name: Feature
description: Define an executable outcome; non-trivial changes get a reviewed plan.
title: ""
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and scope
      description: Who benefits, what should change, and what is outside scope?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behavior an independent maintainer will prove against the real candidate. Product-owner sign-off is not a criterion.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and risks
      description: Include real dependencies, and record plan: required or plan: not required (docs/operations/sdlc.md).
  - type: textarea
    id: validation
    attributes:
      label: Validation and delivery
      description: Tests, documentation, rendered evidence when relevant, release expectations and any explicit stopping point.
    validations:
      required: true
