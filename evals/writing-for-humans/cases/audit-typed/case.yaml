schema_version: "1.1"
name: audit-typed
description: The user types the writing-audit command on a branch that adds a context-dependent decision note and a code comment. Review-only, since no edit tool is granted.
tags: [writing-for-humans, writing-audit]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: /writing-for-humans:writing-audit
    max_turns: 40
    timeout_seconds: 900
    allowed_tools: [Read, Glob, Grep, "Bash(git log:*)", "Bash(git diff:*)", "Bash(git show:*)", "Bash(git status:*)", "Bash(git branch:*)", "Bash(git rev-parse:*)"]
