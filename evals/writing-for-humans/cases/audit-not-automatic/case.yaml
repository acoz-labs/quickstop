schema_version: "1.1"
name: audit-not-automatic
description: The user asks for a writing audit in plain words without typing the command. The user-only writing-audit skill must not be invoked.
tags: [writing-for-humans, writing-audit, negative]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: "Run a writing audit on this branch: check docs/decision-notes.md and tell me what to fix."
    max_turns: 20
    timeout_seconds: 600
    allowed_tools: [Read, Glob, Grep, Skill, "Bash(git log:*)", "Bash(git diff:*)", "Bash(git show:*)", "Bash(git status:*)", "Bash(git branch:*)", "Bash(git rev-parse:*)"]
