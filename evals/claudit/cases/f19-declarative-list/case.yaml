schema_version: "1.1"
name: f19-declarative-list
description: Go library with a healthy setup whose docs page lists numbered standing principles with no imperative verbs or sequence words; no procedure needs a skill (issue 192 F15).
tags: [claudit, issue-192]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: Review this project's Claude Code setup and tell me what to improve.
    max_turns: 120
    timeout_seconds: 1500
    allowed_tools: [Read, Glob, Grep, Skill, Task, Agent, Bash]
