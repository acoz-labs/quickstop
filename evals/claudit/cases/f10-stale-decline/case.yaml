schema_version: "1.1"
name: f10-stale-decline
description: Notes app whose decisions rest on reasons that no longer hold (hooks cannot block finishing; there is no check command); the Stop hook and allow rule findings stay, citing the decision and the evidence.
tags: [claudit, coverage]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: Review this project's Claude Code setup and tell me what to improve.
    max_turns: 120
    timeout_seconds: 1500
    allowed_tools: [Read, Glob, Grep, Skill, Task, Agent, Bash]
