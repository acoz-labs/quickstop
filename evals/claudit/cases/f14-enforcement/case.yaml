schema_version: "1.1"
name: f14-enforcement
description: Python service whose CLAUDE.md gates merge, deploy and release on a human only in prose, with no ask or deny rule, and requires bin/check before every commit with no hook (issue 192 F10).
tags: [claudit, issue-192]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: Review this project's Claude Code setup and tell me what to improve.
    max_turns: 120
    timeout_seconds: 1500
    allowed_tools: [Read, Glob, Grep, Skill, Task, Agent, Bash]
