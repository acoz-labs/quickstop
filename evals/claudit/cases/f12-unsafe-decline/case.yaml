schema_version: "1.1"
name: f12-unsafe-decline
description: Project that dropped pre-approved commands in favour of bypassPermissions in its project settings, which Claude Code ignores there; the defaultMode defect is in the plan, graded as a defect, and cites the decline.
tags: [claudit, coverage]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: Review this project's Claude Code setup and tell me what to improve.
    max_turns: 120
    timeout_seconds: 1500
    allowed_tools: [Read, Glob, Grep, Skill, Task, Agent, Bash]
