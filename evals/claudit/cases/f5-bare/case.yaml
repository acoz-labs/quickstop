schema_version: "1.1"
name: f5-bare
description: Go module with tests and no Claude Code configuration at all; plants Coverage holes for missing instructions and test allowlist.
tags: [claudit, coverage]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: Review this project's Claude Code setup and tell me what to improve.
    max_turns: 120
    timeout_seconds: 1500
    allowed_tools: [Read, Glob, Grep, Skill, Task, Agent, Bash]
