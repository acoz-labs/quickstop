schema_version: "1.1"
name: f2-plugin-repo
description: Repo shipping a Claude Code plugin whose CLAUDE.md points at a missing docs/architecture.md and whose check command has no allow rule; plugin validate and eval advice are gone in Claudit 5.
tags: [claudit, coverage, correctness]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: Review this project's Claude Code setup and tell me what to improve.
    max_turns: 120
    timeout_seconds: 1500
    allowed_tools: [Read, Glob, Grep, Skill, Task, Agent, Bash]
