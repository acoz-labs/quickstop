schema_version: "1.1"
name: f17-scope
description: Rust tool checked out inside a parent folder that has its own CLAUDE.md and AGENTS.md, whose own CLAUDE.md is a symlink to its AGENTS.md (issue 192 F13).
tags: [claudit, issue-192]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: Review this project's Claude Code setup and tell me what to improve.
    max_turns: 120
    timeout_seconds: 1500
    allowed_tools: [Read, Glob, Grep, Skill, Task, Agent, Bash]
