schema_version: "1.1"
name: f8-documented-decline
description: Advisory plugin whose decision record retires hooks for a review checklist while CLAUDE.md has a must-run rule; the report says Nothing found and lists the decision as respected.
tags: [claudit, coverage]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: Review this project's Claude Code setup and tell me what to improve.
    max_turns: 120
    timeout_seconds: 1500
    allowed_tools: [Read, Glob, Grep, Skill, Task, Agent, Bash]
