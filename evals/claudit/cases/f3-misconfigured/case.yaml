schema_version: "1.1"
name: f3-misconfigured
description: JavaScript repo with settings defects /doctor reports and a 241-line CLAUDE.md; Claudit 5 lists only the CLAUDE.md past the documented 200-line target.
tags: [claudit, correctness, alignment]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: Review this project's Claude Code setup and tell me what to improve.
    max_turns: 120
    timeout_seconds: 1500
    allowed_tools: [Read, Glob, Grep, Skill, Task, Agent, Bash]
