schema_version: "1.1"
name: f18-check-commands
description: TypeScript library whose check command is defined only in package.json scripts and CI, with CLAUDE.md saying only to use bun run (issue 192 F14).
tags: [claudit, issue-192]
runs: 1
context:
    scaffold_script: scaffold.sh
execution:
    prompt: Review this project's Claude Code setup and tell me what to improve.
    max_turns: 120
    timeout_seconds: 1500
    allowed_tools: [Read, Glob, Grep, Skill, Task, Agent, Bash]
